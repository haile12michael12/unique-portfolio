<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="chronosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d50ff;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#00ffa3;stop-opacity:0.8" />
    </linearGradient>
    <filter id="chronosGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#chronosBg)"/>
  
  <!-- Grid -->
  <g stroke="#242424" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>
  
  <!-- CRDT lattice structure -->
  <g filter="url(#chronosGlow)">
    <!-- Main lattice nodes -->
    <circle cx="200" cy="200" r="20" fill="#9d50ff" opacity="0.8"/>
    <circle cx="400" cy="150" r="20" fill="#00ffa3" opacity="0.8"/>
    <circle cx="600" cy="200" r="20" fill="#9d50ff" opacity="0.8"/>
    
    <circle cx="300" cy="300" r="20" fill="#00ffa3" opacity="0.8"/>
    <circle cx="500" cy="300" r="20" fill="#9d50ff" opacity="0.8"/>
    
    <circle cx="200" cy="400" r="20" fill="#9d50ff" opacity="0.8"/>
    <circle cx="400" cy="450" r="20" fill="#00ffa3" opacity="0.8"/>
    <circle cx="600" cy="400" r="20" fill="#9d50ff" opacity="0.8"/>
    
    <!-- Central merge node -->
    <circle cx="400" cy="300" r="30" fill="url(#meshGrad)" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <text x="400" y="305" text-anchor="middle" fill="#0a0a0b" font-size="12" font-family="monospace" font-weight="bold">CRDT</text>
  </g>
  
  <!-- Connections -->
  <g stroke-width="2" opacity="0.5" fill="none">
    <line x1="200" y1="200" x2="400" y2="150" stroke="#9d50ff"/>
    <line x1="400" y1="150" x2="600" y2="200" stroke="#00ffa3"/>
    <line x1="200" y1="200" x2="300" y2="300" stroke="#9d50ff"/>
    <line x1="400" y1="150" x2="500" y2="300" stroke="#00ffa3"/>
    <line x1="600" y1="200" x2="500" y2="300" stroke="#9d50ff"/>
    <line x1="300" y1="300" x2="200" y2="400" stroke="#00ffa3"/>
    <line x1="300" y1="300" x2="400" y2="450" stroke="#9d50ff"/>
    <line x1="500" y1="300" x2="400" y2="450" stroke="#00ffa3"/>
    <line x1="500" y1="300" x2="600" y2="400" stroke="#9d50ff"/>
    
    <!-- Connect to center -->
    <line x1="200" y1="200" x2="400" y2="300" stroke="#9d50ff" stroke-width="1.5"/>
    <line x1="400" y1="150" x2="400" y2="300" stroke="#00ffa3" stroke-width="1.5"/>
    <line x1="600" y1="200" x2="400" y2="300" stroke="#9d50ff" stroke-width="1.5"/>
    <line x1="300" y1="300" x2="400" y2="300" stroke="#00ffa3" stroke-width="1.5"/>
    <line x1="500" y1="300" x2="400" y2="300" stroke="#9d50ff" stroke-width="1.5"/>
    <line x1="200" y1="400" x2="400" y2="300" stroke="#00ffa3" stroke-width="1.5"/>
    <line x1="400" y1="450" x2="400" y2="300" stroke="#9d50ff" stroke-width="1.5"/>
    <line x1="600" y1="400" x2="400" y2="300" stroke="#00ffa3" stroke-width="1.5"/>
  </g>
  
  <!-- Sync arrows -->
  <g fill="none" stroke-width="1.5" opacity="0.4">
    <path d="M 200,220 Q 300,260 400,300" stroke="#9d50ff"/>
    <path d="M 600,220 Q 500,260 400,300" stroke="#00ffa3"/>
    <path d="M 400,300 Q 300,360 200,400" stroke="#00ffa3"/>
    <path d="M 400,300 Q 500,360 600,400" stroke="#9d50ff"/>
  </g>
  
  <!-- Operation labels -->
  <g fill="#606060" font-size="9" font-family="monospace">
    <text x="280" y="240">op₁</text>
    <text x="480" y="240">op₂</text>
    <text x="280" y="380">op₃</text>
    <text x="480" y="380">op₄</text>
  </g>
  
  <!-- WASM indicator -->
  <g opacity="0.7">
    <rect x="340" y="520" width="120" height="40" rx="6" fill="#1a0a2e" stroke="#9d50ff" stroke-width="2"/>
    <text x="400" y="545" text-anchor="middle" fill="#9d50ff" font-size="12" font-family="monospace" font-weight="bold">WASM</text>
  </g>
  
  <!-- Concurrency indicators -->
  <g fill="#606060" font-size="9" font-family="monospace">
    <text x="200" y="180" text-anchor="middle">Peer 1</text>
    <text x="400" y="130" text-anchor="middle">Peer 2</text>
    <text x="600" y="180" text-anchor="middle">Peer 3</text>
    <text x="300" y="280" text-anchor="middle">Peer 4</text>
    <text x="500" y="280" text-anchor="middle">Peer 5</text>
    <text x="200" y="420" text-anchor="middle">Peer 6</text>
    <text x="400" y="470" text-anchor="middle">Peer 7</text>
    <text x="600" y="420" text-anchor="middle">Peer 8</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="580" text-anchor="middle" fill="#9d50ff" font-size="14" font-family="monospace" font-weight="bold">CHRONOS MESH</text>
</svg>
