<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0a2e;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d50ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#00ffa3;stop-opacity:0.7" />
    </linearGradient>
    <filter id="nexusGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#nexusBg)"/>
  
  <!-- Grid -->
  <g stroke="#242424" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>
  
  <!-- Distributed nodes -->
  <g filter="url(#nexusGlow)">
    <!-- Central hub -->
    <circle cx="400" cy="300" r="40" fill="url(#nodeGrad)" stroke="#9d50ff" stroke-width="3"/>
    <text x="400" y="305" text-anchor="middle" fill="#ffffff" font-size="12" font-family="monospace">HUB</text>
    
    <!-- Region nodes -->
    <circle cx="150" cy="150" r="25" fill="#9d50ff" stroke="#00ffa3" stroke-width="2" opacity="0.8"/>
    <text x="150" y="155" text-anchor="middle" fill="#ffffff" font-size="10" font-family="monospace">R1</text>
    
    <circle cx="650" cy="150" r="25" fill="#00ffa3" stroke="#9d50ff" stroke-width="2" opacity="0.8"/>
    <text x="650" y="155" text-anchor="middle" fill="#0a0a0b" font-size="10" font-family="monospace">R2</text>
    
    <circle cx="150" cy="450" r="25" fill="#9d50ff" stroke="#00ffa3" stroke-width="2" opacity="0.8"/>
    <text x="150" y="455" text-anchor="middle" fill="#ffffff" font-size="10" font-family="monospace">R3</text>
    
    <circle cx="650" cy="450" r="25" fill="#00ffa3" stroke="#9d50ff" stroke-width="2" opacity="0.8"/>
    <text x="650" y="455" text-anchor="middle" fill="#0a0a0b" font-size="10" font-family="monospace">R4</text>
    
    <!-- Edge nodes -->
    <circle cx="100" cy="300" r="15" fill="#9d50ff" opacity="0.6"/>
    <circle cx="700" cy="300" r="15" fill="#00ffa3" opacity="0.6"/>
    <circle cx="400" cy="100" r="15" fill="#9d50ff" opacity="0.6"/>
    <circle cx="400" cy="500" r="15" fill="#00ffa3" opacity="0.6"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#9d50ff" stroke-width="2" opacity="0.5" fill="none">
    <line x1="400" y1="300" x2="150" y2="150"/>
    <line x1="400" y1="300" x2="650" y2="150"/>
    <line x1="400" y1="300" x2="150" y2="450"/>
    <line x1="400" y1="300" x2="650" y2="450"/>
    <line x1="400" y1="300" x2="100" y2="300"/>
    <line x1="400" y1="300" x2="700" y2="300"/>
    <line x1="400" y1="300" x2="400" y2="100"/>
    <line x1="400" y1="300" x2="400" y2="500"/>
  </g>
  
  <!-- Event flow arrows -->
  <g stroke="#00ffa3" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 150,150 Q 275,225 400,300" />
    <path d="M 650,150 Q 525,225 400,300" />
    <path d="M 150,450 Q 275,375 400,300" />
    <path d="M 650,450 Q 525,375 400,300" />
  </g>
  
  <!-- Data packets -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="275" cy="225" r="3" />
    <circle cx="525" cy="225" r="3" />
    <circle cx="275" cy="375" r="3" />
    <circle cx="525" cy="375" r="3" />
  </g>
  
  <!-- Labels -->
  <text x="400" y="560" text-anchor="middle" fill="#9d50ff" font-size="14" font-family="monospace" font-weight="bold">NEXUS ENGINE</text>
  <text x="400" y="580" text-anchor="middle" fill="#606060" font-size="10" font-family="monospace">DISTRIBUTED SYSTEM ARCHITECTURE</text>
</svg>
