<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="atlasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1a2e;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9d50ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00ffa3;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffa3;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9d50ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="atlasGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#atlasBg)"/>
  
  <!-- Grid -->
  <g stroke="#242424" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>
  
  <!-- Pipeline stages -->
  <g filter="url(#atlasGlow)">
    <!-- Stage 1: Ingestion -->
    <rect x="50" y="150" width="120" height="80" rx="8" fill="#1a0a2e" stroke="#9d50ff" stroke-width="2"/>
    <text x="110" y="185" text-anchor="middle" fill="#9d50ff" font-size="11" font-family="monospace" font-weight="bold">INGEST</text>
    <text x="110" y="205" text-anchor="middle" fill="#606060" font-size="9" font-family="monospace">S3, GCS, DB</text>
    
    <!-- Stage 2: Validation -->
    <rect x="210" y="150" width="120" height="80" rx="8" fill="#1a0a2e" stroke="#00ffa3" stroke-width="2"/>
    <text x="270" y="185" text-anchor="middle" fill="#00ffa3" font-size="11" font-family="monospace" font-weight="bold">VALIDATE</text>
    <text x="270" y="205" text-anchor="middle" fill="#606060" font-size="9" font-family="monospace">Schema Check</text>
    
    <!-- Stage 3: Transform -->
    <rect x="370" y="150" width="120" height="80" rx="8" fill="#1a0a2e" stroke="#9d50ff" stroke-width="2"/>
    <text x="430" y="185" text-anchor="middle" fill="#9d50ff" font-size="11" font-family="monospace" font-weight="bold">TRANSFORM</text>
    <text x="430" y="205" text-anchor="middle" fill="#606060" font-size="9" font-family="monospace">Spark DAGs</text>
    
    <!-- Stage 4: Load -->
    <rect x="530" y="150" width="120" height="80" rx="8" fill="#1a0a2e" stroke="#00ffa3" stroke-width="2"/>
    <text x="590" y="185" text-anchor="middle" fill="#00ffa3" font-size="11" font-family="monospace" font-weight="bold">LOAD</text>
    <text x="590" y="205" text-anchor="middle" fill="#606060" font-size="9" font-family="monospace">Snowflake</text>
    
    <!-- Stage 5: Monitor -->
    <rect x="690" y="150" width="80" height="80" rx="8" fill="#1a0a2e" stroke="#9d50ff" stroke-width="2"/>
    <text x="730" y="185" text-anchor="middle" fill="#9d50ff" font-size="11" font-family="monospace" font-weight="bold">MON</text>
    <text x="730" y="205" text-anchor="middle" fill="#606060" font-size="9" font-family="monospace">SLA</text>
  </g>
  
  <!-- Flow connections -->
  <g stroke-width="3" fill="none">
    <line x1="170" y1="190" x2="210" y2="190" stroke="url(#flowGrad1)"/>
    <line x1="330" y1="190" x2="370" y2="190" stroke="url(#flowGrad2)"/>
    <line x1="490" y1="190" x2="530" y2="190" stroke="url(#flowGrad1)"/>
    <line x1="650" y1="190" x2="690" y2="190" stroke="url(#flowGrad2)"/>
  </g>
  
  <!-- Data flow lines (vertical) -->
  <g stroke="#9d50ff" stroke-width="2" opacity="0.3" fill="none">
    <path d="M 110,230 Q 110,350 270,350" />
    <path d="M 270,230 Q 270,400 430,400" />
    <path d="M 430,230 Q 430,450 590,450" />
  </g>
  
  <g stroke="#00ffa3" stroke-width="2" opacity="0.3" fill="none">
    <path d="M 590,230 Q 590,350 730,350" />
  </g>
  
  <!-- Data packets flowing -->
  <g filter="url(#atlasGlow)">
    <circle cx="190" cy="190" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="350" cy="190" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="510" cy="190" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="670" cy="190" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- ML/AI indicators -->
  <g opacity="0.6">
    <circle cx="200" cy="450" r="30" fill="none" stroke="#9d50ff" stroke-width="1.5"/>
    <circle cx="200" cy="450" r="20" fill="none" stroke="#00ffa3" stroke-width="1"/>
    <text x="200" y="455" text-anchor="middle" fill="#9d50ff" font-size="10" font-family="monospace">ML</text>
    
    <circle cx="400" cy="450" r="30" fill="none" stroke="#00ffa3" stroke-width="1.5"/>
    <circle cx="400" cy="450" r="20" fill="none" stroke="#9d50ff" stroke-width="1"/>
    <text x="400" y="455" text-anchor="middle" fill="#00ffa3" font-size="10" font-family="monospace">AI</text>
    
    <circle cx="600" cy="450" r="30" fill="none" stroke="#9d50ff" stroke-width="1.5"/>
    <circle cx="600" cy="450" r="20" fill="none" stroke="#00ffa3" stroke-width="1"/>
    <text x="600" y="455" text-anchor="middle" fill="#9d50ff" font-size="10" font-family="monospace">ETL</text>
  </g>
  
  <!-- Volume indicators -->
  <g fill="#606060" font-size="9" font-family="monospace">
    <text x="110" y="530" text-anchor="middle">52TB/day</text>
    <text x="270" y="530" text-anchor="middle">99.97% SLA</text>
    <text x="430" y="530" text-anchor="middle">1,200+ DAGs</text>
    <text x="590" y="530" text-anchor="middle">34 Sources</text>
    <text x="730" y="530" text-anchor="middle">15min</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="580" text-anchor="middle" fill="#9d50ff" font-size="14" font-family="monospace" font-weight="bold">ATLAS PIPELINE</text>
</svg>
