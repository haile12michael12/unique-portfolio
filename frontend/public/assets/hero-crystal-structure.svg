<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crystalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9d50ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00ffa3;stop-opacity:0.6" />
    </linearGradient>
    <linearGradient id="crystalGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffa3;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#9d50ff;stop-opacity:0.5" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g stroke="#242424" stroke-width="1" opacity="0.3">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  
  <!-- Crystal structures -->
  <g filter="url(#glow)" opacity="0.6">
    <!-- Main crystal cluster -->
    <polygon points="1200,300 1350,200 1400,350 1250,450" fill="url(#crystalGrad1)" stroke="#9d50ff" stroke-width="2"/>
    <polygon points="1350,200 1500,280 1450,400 1400,350" fill="url(#crystalGrad2)" stroke="#00ffa3" stroke-width="2"/>
    <polygon points="1250,450 1400,350 1450,400 1300,520" fill="url(#crystalGrad1)" stroke="#9d50ff" stroke-width="2"/>
    
    <!-- Secondary crystals -->
    <polygon points="1100,500 1200,420 1250,450 1150,550" fill="url(#crystalGrad2)" stroke="#00ffa3" stroke-width="1.5"/>
    <polygon points="1450,250 1550,180 1600,300 1500,280" fill="url(#crystalGrad1)" stroke="#9d50ff" stroke-width="1.5"/>
    
    <!-- Small accent crystals -->
    <polygon points="1350,600 1400,550 1450,580 1400,630" fill="url(#crystalGrad2)" stroke="#00ffa3" stroke-width="1"/>
    <polygon points="1050,350 1100,300 1150,330 1100,380" fill="url(#crystalGrad1)" stroke="#9d50ff" stroke-width="1"/>
  </g>
  
  <!-- Data flow lines -->
  <g stroke="#9d50ff" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 1200,300 Q 1100,200 1000,250 T 800,200" />
    <path d="M 1400,350 Q 1500,300 1600,350 T 1800,300" />
    <path d="M 1300,520 Q 1250,600 1200,650 T 1100,700" />
  </g>
  
  <g stroke="#00ffa3" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 1150,550 Q 1050,500 950,550 T 750,500" />
    <path d="M 1500,280 Q 1600,200 1700,250 T 1850,200" />
  </g>
  
  <!-- Glowing nodes -->
  <g fill="#9d50ff" opacity="0.8">
    <circle cx="1200" cy="300" r="4" />
    <circle cx="1400" cy="350" r="4" />
    <circle cx="1300" cy="520" r="4" />
    <circle cx="1100" cy="500" r="3" />
    <circle cx="1450" cy="250" r="3" />
  </g>
  
  <g fill="#00ffa3" opacity="0.8">
    <circle cx="1350" cy="200" r="3" />
    <circle cx="1250" cy="450" r="3" />
    <circle cx="1500" cy="280" r="3" />
    <circle cx="1450" cy="400" r="3" />
    <circle cx="1150" cy="550" r="2" />
  </g>
  
  <!-- Abstract data particles -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="900" cy="400" r="2" />
    <circle cx="950" cy="350" r="1.5" />
    <circle cx="850" cy="450" r="2" />
    <circle cx="1000" cy="300" r="1.5" />
    <circle cx="1600" cy="400" r="2" />
    <circle cx="1650" cy="350" r="1.5" />
    <circle cx="1700" cy="450" r="2" />
  </g>
</svg>
